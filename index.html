<style>
:root{--parch:rgba(244,236,223,.95);--parch-d:rgba(227,211,189,.97);--bd:#b8976a;--ink:#1f1814;--brown:#4a3325;--gold:#7a5c24;--red:#73261f;--green:#354a32}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#2a1f18;color:var(--ink);font-family:'EB Garamond','Amiri',serif;font-size:18px;min-height:100vh;padding:2rem 1rem;overflow-x:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px #f4ecdf}
button,input{font-family:inherit}button{cursor:pointer}
.sc{font-family:'IM Fell English SC','Amiri',serif}

/* Vintage Clean Background replacing video */
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 50%, #3d2c22 0%, #1a120e 100%);}
.tint{position:fixed;inset:0;background:rgba(31,24,20,.3);z-index:-1}

/* Shared parchment panel */
.panel,header,.card,.about div{background:var(--parch);border:1px solid var(--bd);border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.wrapw{max-width:1100px;margin:0 auto}

.topbar{max-width:1100px;margin:0 auto 1.2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
.auth,.lang{background:var(--parch-d);border:1px solid var(--bd);border-radius:3px;padding:.4rem .9rem;display:flex;align-items:center;gap:.8rem}
.btn{background:var(--brown);color:#f4ecdf;border:1px solid var(--gold);border-radius:3px;padding:.45rem 1rem;font-size:.95rem;font-weight:600;min-height:40px}
.btn:hover{background:var(--red)}
.lang{color:var(--ink);font-size:1rem;font-weight:600}.lang:hover{background:var(--gold);color:#fff}

header{text-align:center;padding:2.2rem 1.5rem;margin:0 auto 1.5rem;max-width:1100px;border:4px double var(--bd)}
.orn{color:var(--gold);font-size:1.8rem}
h1{font-family:'IM Fell English SC','Amiri',serif;font-size:clamp(1.9rem,5vw,2.8rem);color:var(--brown);font-weight:400;line-height:1.2;margin:.2rem 0}
.sub{color:var(--gold);font-size:1.05rem;font-weight:600}
.motto{font-family:'Amiri',serif;font-size:1.5rem;font-weight:700;margin:1rem auto;display:inline-block;padding:.2rem 2rem;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.lead{max-width:62ch;margin:.4rem auto 0;line-height:1.7;color:var(--brown)}
.stats{display:flex;justify-content:center;gap:.7rem;flex-wrap:wrap;margin-top:1.3rem;padding-top:1.1rem;border-top:1px dashed var(--bd)}
.stat{background:rgba(255,255,255,.75);border:1px solid var(--bd);border-radius:3px;padding:.3rem .9rem;font-weight:600;font-size:.95rem}
.stat b{color:var(--red);font-family:monospace;font-size:1rem}

/* Controls */
.controls{max-width:1100px;margin:0 auto 1.5rem;display:flex;flex-direction:column;gap:1rem}
.search{width:100%;padding:.9rem 1.2rem;background:var(--parch);border:1px solid var(--bd);border-radius:3px;font-size:1.05rem;color:var(--ink);box-shadow:inset 0 2px 5px rgba(0,0,0,.1)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;align-items:center}
.row-title{color:#f4ecdf;font-size:.95rem;text-align:center;letter-spacing:.5px}
.chip{background:var(--parch);border:1px solid var(--bd);color:var(--ink);padding:.45rem 1rem;border-radius:3px;font-size:.95rem;font-weight:600;min-height:40px;display:flex;gap:.5rem;align-items:center}
.chip i{font-style:normal;font-family:monospace;font-size:.8rem;background:#fff;border:1px solid var(--bd);padding:0 .35rem;border-radius:2px}
.chip:hover,.chip[aria-pressed=true]{background:var(--brown);color:#f4ecdf;border-color:var(--brown)}
.row.cats .chip{font-size:.9rem;min-height:36px}
.row.cats .chip:hover,.row.cats .chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#fff}
.count{max-width:1200px;margin:0 auto .8rem;color:#f4ecdf;font-size:.95rem}

/* Grid + cards */
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:1.4rem}
.card{padding:1.5rem;display:flex;flex-direction:column;justify-content:space-between}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.5rem}
.card h3{font-family:'IM Fell English SC','Amiri',serif;font-size:1.3rem;color:var(--brown);font-weight:400;line-height:1.3}
.yr{font-family:monospace;font-size:.85rem;font-weight:700;color:var(--red);background:#fff;border:1px solid var(--bd);padding:.1rem .4rem;border-radius:2px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .8rem;background:rgba(255,255,255,.65);border:1px solid var(--bd);border-radius:3px;padding:.75rem;margin:.7rem 0 .9rem;font-size:.9rem}
.specs .w{grid-column:1/-1}.specs span{display:block;line-height:1.3}
.lbl{font-family:'IM Fell English SC','Amiri',serif;font-size:.78rem;font-weight:700;color:var(--gold);letter-spacing:.4px}
.desc{font-size:1rem;line-height:1.6;margin-bottom:.9rem}
.ins{background:rgba(255,255,255,.7);border-inline-start:3px solid var(--gold);padding:.7rem;font-size:.95rem;line-height:1.5;margin-bottom:1rem}
.ins strong{display:block;color:var(--brown);font-size:.85rem;font-family:'IM Fell English SC','Amiri',serif;font-weight:400}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.act{flex:1;min-width:130px;padding:.6rem;border-radius:3px;font-size:.95rem;font-weight:600;text-align:center;text-decoration:none;color:#fff;background:var(--brown);border:1px solid var(--brown);min-height:40px}
.act.ar{background:var(--gold);border-color:var(--gold)}.act:hover{background:var(--ink)}
.stat-row{display:flex;gap:.4rem;border-top:1px solid var(--bd);padding-top:.9rem;margin-top:auto}
.sb{flex:1;background:#fff;border:1px solid var(--bd);color:var(--ink);padding:.5rem .3rem;border-radius:3px;font-size:.9rem;font-weight:600;min-height:40px}
.sb:hover{background:var(--gold);color:#fff}
.sb[aria-pressed=true]{color:#fff}.sb.read[aria-pressed=true]{background:var(--green);border-color:var(--green)}.sb.reading[aria-pressed=true]{background:var(--gold);border-color:var(--gold)}.sb.unread[aria-pressed=true]{background:var(--red);border-color:var(--red)}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:#f4ecdf;font-size:1.2rem}

/* Pagination */
.pager{max-width:760px;margin:2.5rem auto 1rem;display:flex;justify-content:center;align-items:center;gap:.8rem;flex-wrap:wrap;color:#f4ecdf}
.pager .chip{justify-content:center}.pager .chip:disabled{opacity:.45;cursor:not-allowed}
.jump{display:flex;align-items:center;gap:.4rem;font-size:.95rem}
.jump input{width:76px;padding:.35rem;border-radius:3px;border:1px solid var(--bd);text-align:center;font-weight:700;background:var(--parch);min-height:40px}

/* About + footer */
.about{max-width:1100px;margin:3rem auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1.4rem}
.about div{padding:1.5rem}
.about h2{font-family:'IM Fell English SC','Amiri',serif;color:var(--brown);font-size:1.2rem;font-weight:400;border-bottom:1px solid var(--bd);padding-bottom:.4rem;margin-bottom:.7rem}
.about p{font-size:1rem;line-height:1.65}
footer{text-align:center;margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid #b8976a;color:#f4ecdf;font-size:.95rem;line-height:1.6}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translate(-50%,120px);background:var(--ink);color:#f4ecdf;padding:.8rem 1.4rem;border-radius:3px;border:1px solid var(--gold);transition:transform .35s;z-index:20;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
@media(max-width:560px){.specs{grid-template-columns:1fr}.stat-row .sb{font-size:.85rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>

  <nav class="pager" aria-label="Pagination">
    <button class="chip" id="first" aria-label="First page">«</button>
    <button class="chip" id="prev"></button>
    <span id="pageInfo"></span>
    <button class="chip" id="next"></button>
    <button class="chip" id="last" aria-label="Last page">»</button>
    <label class="jump"><span data-i="jump"></span><input type="number" id="jumpIn" min="1" value="1"></label>
  </nav>

    <div><h2 data-i="aboutL"></h2><p data-i="aboutLT"></p></div>
    <div><h2 data-i="aboutC"></h2><p data-i="aboutCT"></p></div>

</main>

<footer>

{cat:'russian',title:'War and Peace',titleAr:'الحرب والسلام',author:'Leo Tolstoy',authorAr:'ليو تولستوي',year:'1869',lang:'Russian',langAr:'الروسية',genre:'Historical Epic',genreAr:'الملحمة التاريخية',setting:'Imperial Russia',settingAr:'روسيا القيصرية',theme:'Epic Destiny & Free Will',themeAr:'القدر الإنساني والفلسفة التاريخية',desc:"Tolstoy's panorama of aristocratic families through the Napoleonic invasion, weighing free will against determinism.",descAr:'ملحمة الأدب الروسي التي تسرد مصائر العائلات النبيلة إبان حروب نابليون وتناقش فلسفة الإرادة والتاريخ.',insight:'History is steered less by rulers than by the small decisions of everyday people.',insightAr:'التاريخ لا يصنعه القادة وحدهم، بل ملايين الأفعال الصغيرة.'},
{cat:'philosophy',title:'The Metamorphosis',titleAr:'المسخ',author:'Franz Kafka',authorAr:'فرانز كافكا',year:'1915',lang:'German',langAr:'الألمانية',genre:'Absurdist Fiction',genreAr:'أدب العبث',setting:'Prague',settingAr:'براغ',theme:'Alienation & Utilitarianism',themeAr:'الاغتراب والمنفعة المادية',desc:'Gregor Samsa wakes transformed into a vermin and learns his family values him only for his income.',descAr:'يستيقظ غريغور سامسا ليجد نفسه حشرة، فتتكشف قسوة عائلته التي قدّرت إنتاجه لا إنسانيته.',insight:'When your economic usefulness ends, affection can vanish with terrifying speed.',insightAr:'حين تسقط قدرتك على الإنتاج، قد يتلاشى تقدير أقرب الناس إليك بسرعة.'},
{cat:'arabic',title:'The Cairo Trilogy',titleAr:'ثلاثية القاهرة',author:'Naguib Mahfouz',authorAr:'نجيب محفوظ',year:'1957',lang:'Arabic',langAr:'العربية',genre:'Social Realism',genreAr:'الواقعية الاجتماعية',setting:'Cairo, Egypt',settingAr:'القاهرة، مصر',theme:'Tradition vs Modernity',themeAr:'التقاليد والتحولات الاجتماعية',desc:"Three generations of a traditional Cairo household during Egypt's political awakening.",descAr:'ملحمة أجيال عائلة قاهرية عبر عقود، ترصد تحولات المجتمع وصراع الأبناء بين التقاليد والحرية.',insight:'Time is the ruler that eventually changes every fixed order.',insightAr:'الزمن هو الحاكم الفعلي الذي يغيّر كل الثوابت.'}];
const AUTH=[
{name:'Robert Kiyosaki',nameAr:'روبرت كيوساكي',cat:'modern',lang:'English',langAr:'الإنجليزية',genre:'Financial Mastery',genreAr:'المال والأعمال',setting:'Global',settingAr:'عالمي',theme:'Wealth Building',themeAr:'صناعة الثروة',insight:'Assets put money in your pocket.',insightAr:'الأصول تضع المال في جيبك.'},
{name:'Fahd Al-Ahmadi',nameAr:'فهد الأحمدي',cat:'modern',lang:'Arabic',langAr:'العربية',genre:'Mindset & Growth',genreAr:'تطوير العقلية',setting:'Middle East',settingAr:'الشرق الأوسط',theme:'Cognitive Expansion',settingAr:'توسيع الإدراك',insight:'Small habits compound into large life changes.',insightAr:'العادات الصغيرة تصنع فارقاً هائلاً عبر الزمن.'},
{name:'Fyodor Dostoevsky',nameAr:'فيودور دوستويفسكي',cat:'dostoevsky',lang:'Russian',langAr:'الروسية',genre:'Psychological Realism',genreAr:'الواقعية النفسية',setting:'St. Petersburg',settingAr:'سانت بطرسبرغ',theme:'Conscience & Faith',settingAr:'الضمير والإيمان',insight:'To love someone is to see them as God intended them.',insightAr:'أن تحب شخصاً يعني أن تراه كما أراده الله.'},
{name:'Leo Tolstoy',nameAr:'ليو تولستوي',cat:'russian',lang:'Russian',langAr:'الروسية',genre:'Epic Realism',genreAr:'الواقعية الملحمية',setting:'Russia',settingAr:'روسيا',theme:'Moral Purity',settingAr:'النقاء الأخلاقي',insight:'The two most powerful warriors are patience and time.',insightAr:'أقوى المحاربين هما الصبر والزمن.'}];
const VOL=[{en:'Masterclass Edition',ar:'طبعة الخبراء'},{en:'Expanded Codex',ar:'المجلد الموسع'},{en:'Philosophical Treatise',ar:'دراسة فلسفية'},{en:'Private Archives',ar:'الأرشيف الخاص'}];
const TOTAL=500000,PAGE=25,CATS=['all','modern','dostoevsky','russian','philosophy','arabic'];

function bookAt(i){
  if(i<CORE.length)return{id:'b'+(i+1),...CORE[i]};
  const n=i+1,a=AUTH[i%4],v=VOL[Math.floor(n/4)%4];
  return{id:'b'+n,cat:a.cat,title:`${a.name}: ${v.en} (Vol. ${n})`,titleAr:`${a.nameAr}: ${v.ar} (مجلد ${n})`,author:a.name,authorAr:a.nameAr,year:'',
    lang:a.lang,langAr:a.langAr,genre:a.genre,genreAr:a.genreAr,setting:a.setting,settingAr:a.settingAr,theme:a.theme,themeAr:a.themeAr,
    desc:`A publication by ${a.name} on human intellect, strategy, and timeless principles.`,descAr:`مؤلَّف للمفكر ${a.nameAr} يستقصي المبادئ الخالدة والوعي المعرفي.`,insight:a.insight,insightAr:a.insightAr,generated:true};
}

/* ===== STATE ===== */
let lang=(()=>{try{return localStorage.getItem('lib_lang')||'en'}catch(e){return'en'}})();
let cat='all',status='all',query='',page=1,filtered=[],user=null,st={};
const $=id=>document.getElementById(id),t=()=>T[lang],nf=n=>n.toLocaleString(lang==='ar'?'ar':'en');
const L=(b,k)=>lang==='ar'?(b[k+'Ar']||b[k]):b[k];
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2800)}

/* ===== FILTER ===== */
function refilter(){
  const q=query.trim().toLowerCase(),out=[];
  for(let i=0;i<TOTAL;i++){
    const c=i<CORE.length?CORE[i].cat:AUTH[i%4].cat;
    if(cat!=='all'&&c!==cat)continue;
    if(status!=='all'&&(st['b'+(i+1)]||'unread')!==status)continue;
    if(q){const b=bookAt(i);
      if(!`${L(b,'title')} ${L(b,'author')} ${L(b,'theme')} ${L(b,'genre')} ${L(b,'setting')} ${L(b,'desc')} ${b.year}`.toLowerCase().includes(q))continue}
    out.push(i);
  }
  filtered=out;
}

/* ===== RENDER ===== */
function archiveUrl(s){return`https://archive.org/search?query=${encodeURIComponent(s)}&and[]=mediatype%3A%22texts%22`}
function render(){
  const tr=t(),pages=Math.max(1,Math.ceil(filtered.length/PAGE));
  page=Math.min(Math.max(1,page),pages);
  const slice=filtered.slice((page-1)*PAGE,page*PAGE),g=$('grid');
  g.innerHTML=slice.length?slice.map(i=>{
    const b=bookAt(i),s=st[b.id]||'unread';
    /* Archive search query using book title ONLY (no author name) */
    const qEn=b.title,qAr=b.titleAr||b.title;
    const btn=(k,label)=>`<button class="sb ${k}" aria-pressed="${s===k}" data-b="${b.id}" data-k="${k}">${label}</button>`;
    return`<article class="card" id="c-${b.id}"><div>
     <div class="bh"><h3>${L(b,'title')}</h3>${b.year?`<span class="yr">${b.year}</span>`:''}</div>
     <div class="specs">
      <div><span class="lbl">${tr.f.author}</span><span>${L(b,'author')}</span></div>
      <div><span class="lbl">${tr.f.lang}</span><span>${L(b,'lang')}</span></div>
      <div><span class="lbl">${tr.f.genre}</span><span>${L(b,'genre')}</span></div>
      <div><span class="lbl">${tr.f.setting}</span><span>${L(b,'setting')}</span></div>
      <div class="w"><span class="lbl">${tr.f.theme}</span><span>${L(b,'theme')}</span></div></div>
     <p class="desc">${L(b,'desc')}</p>
     <div class="ins"><strong>${tr.f.ins}</strong>${L(b,'insight')}</div>
     <div class="acts"><a class="act" href="${archiveUrl(qEn)}" target="_blank" rel="noopener noreferrer">${tr.aEn}</a><a class="act ar" href="${archiveUrl(qAr)}" target="_blank" rel="noopener noreferrer">${tr.aAr}</a></div></div>
     <div class="stat-row">${btn('read',tr.bRead)}${btn('reading',tr.bReading)}${btn('unread',tr.bUnread)}</div></article>`}).join('')
    :`<div class="empty">${tr.none}</div>`;
  $('count').textContent=tr.works(filtered.length);$('pageInfo').textContent=tr.page(page,pages);
  $('first').disabled=$('prev').disabled=page===1;$('next').disabled=$('last').disabled=page===pages;
  $('jumpIn').max=pages;$('jumpIn').value=page;
  stats();
}
function stats(){
  let r=0,rd=0;for(const k in st){if(st[k]==='read')r++;else if(st[k]==='reading')rd++}
  const u=TOTAL-r-rd;
  [['sTotal','bAll',TOTAL],['sRead','bRead',r],['sReading','bReading',rd],['sUnread','bUnread',u]].forEach(([a,b,v])=>{$(a).textContent=nf(v);$(b).textContent=nf(v)});
}
function cats(){$('catRow').innerHTML=CATS.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${t().cats[c]}</button>`).join('')}
function scrollTop(){$('grid').scrollIntoView({behavior:'smooth',block:'start'})}

/* ===== LANGUAGE ===== */
function applyLang(){
  const tr=t(),h=document.documentElement;h.lang=lang;h.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=tr[e.dataset.i]});
  $('q').placeholder=tr.search;$('prev').textContent=(lang==='ar'?'':'◀ ')+tr.prev+(lang==='ar'?' ▶':'');
  $('next').textContent=(lang==='ar'?'◀ ':'')+tr.next+(lang==='ar'?'':' ▶');$('langBtn').textContent=tr.langBtn;$('langBtn').lang=lang==='ar'?'ar':'en';$('langBtn').setAttribute('aria-label',lang==='ar'?'Switch to English':'التبديل إلى العربية');
  if(user)$('welcome').textContent=tr.welcome(user.displayName||user.email.split('@')[0]);
  cats();refilter();render();
}

/* ===== EVENTS ===== */
$('langBtn').onclick=()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem('lib_lang',lang)}catch(e){}applyLang()};
let deb;$('q').oninput=e=>{clearTimeout(deb);deb=setTimeout(()=>{query=e.target.value;page=1;refilter();render()},250)};$('statusRow').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;status=b.dataset.s;page=1;
  document.querySelectorAll('#statusRow .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));refilter();render()};
$('catRow').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;page=1;cats();refilter();render()};
const go=p=>{page=p;render();scrollTop()};
$('first').onclick=()=>go(1);$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('last').onclick=()=>go(Math.ceil(filtered.length/PAGE)||1);
$('jumpIn').onchange=e=>{const p=parseInt(e.target.value,10);if(p>=1)go(p)};$('grid').onclick=async e=>{
  const b=e.target.closest('.sb');if(!b)return;
  if(!user)return toast(t().need);
  st[b.dataset.b]=b.dataset.k;
  try{await window.setDoc(window.doc(window.db,'userLibraries',user.uid),{statuses:st},{merge:true})}catch(err){console.error('Cloud sync error:',err)}
  if(status!=='all'){refilter();render()}else{
    b.parentNode.querySelectorAll('.sb').forEach(x=>x.setAttribute('aria-pressed',x===b));stats()}
};

/* ===== AUTH ===== */
$('loginBtn').onclick=()=>{
  if(!window.myAuth)return toast('Sign-in is unavailable right now. Check your connection and try again.');
  window.signInWithPopup(window.myAuth,window.googleProvider).catch(err=>toast('Google login error: '+err.message))};
$('logoutBtn').onclick=()=>{if(confirm(t().confirm))window.signOut(window.myAuth).catch(err=>toast('Logout error: '+err.message))};
function initAuth(){
  window.onAuthStateChanged(window.myAuth,async u=>{
    user=u;$('out').style.display=u?'none':'block';$('in').style.display=u?'flex':'none';st={};
    if(u){$('welcome').textContent=t().welcome(u.displayName||u.email.split('@')[0]);
      try{const s=await window.getDoc(window.doc(window.db,'userLibraries',u.uid));if(s.exists())st=s.data().statuses||{}}catch(err){console.error('Cloud data load error:',err)}}
    refilter();render()})}
if(window.myAuth)initAuth();else window.addEventListener('firebase-ready',initAuth,{once:true});

applyLang();
</script>
</body>
</html>
